[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "tmp", "browser_data", "browser_data_rt"]

[tool.ruff.lint]
# Correctness checks cover the whole legacy tree. New components additionally
# use the full E4/E7/E9/F/I rules through scripts/check.py.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
