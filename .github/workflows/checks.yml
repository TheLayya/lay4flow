name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm --prefix frontend ci
      - name: Check and build frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Run offline checks
        run: python scripts/check.py
      - name: Build Linux runtime
        if: runner.os == 'Linux'
        run: docker build -t lay4flow-remote:ci .
      - name: Smoke test isolated Linux runtime
        if: runner.os == 'Linux'
        run: docker run --rm --network none lay4flow-remote:ci python scripts/smoke_package.py
      - name: Verify runtime release package
        if: runner.os == 'Linux'
        run: python scripts/package_release.py "$RUNNER_TEMP/lay4flow-remote-runtime.tar.gz"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lay4flow-remote-runtime
          path: ${{ runner.temp }}/lay4flow-remote-runtime.tar.gz
          if-no-files-found: error
